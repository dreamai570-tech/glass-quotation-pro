<script src="https://cdn.tailwindcss.com"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#eef3f8;overflow-x:hidden;overflow-y:auto;color:#172033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-y:contain}.card{background:#fff;border:1px solid #dce4ee;border-radius:18px;box-shadow:0 8px 30px rgba(20,45,80,.07)}input,select,textarea,button{font:inherit}input,select,textarea{outline:none}input:focus,select:focus,textarea:focus{border-color:#2563eb!important;box-shadow:0 0 0 3px rgba(37,99,235,.10)}button{touch-action:manipulation}.no-print{}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #d8dee8}.stickybar{position:sticky;top:0;z-index:30;background:rgba(238,243,248,.92);backdrop-filter:blur(10px)}@media print{body{background:#fff}.no-print,.stickybar,.appnav{display:none!important}.card{box-shadow:none;border:0}.print-only{display:block!important}#print-area{box-shadow:none!important;border:0!important}.page-break{break-inside:avoid}.print-table{font-size:10px}}.print-only{display:none}

/* Mobile safe layout */
html,body{width:100%;max-width:100%;min-width:0;margin:0;padding:0;overflow:hidden}#root{width:100%;max-width:100%;min-width:0;height:100vh;height:100dvh;overflow:hidden}.app-shell{width:100%;min-height:100vh;min-height:100dvh;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto;scrollbar-width:auto}
*,*::before,*::after{box-sizing:border-box;min-width:0}
img,svg,video,canvas{max-width:100%;height:auto}

main,.max-w-7xl,.max-w-6xl{width:100%;max-width:100%}

  .grid.grid-cols-4{grid-template-columns:repeat(2,minmax(0,1fr))!important}

}

<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const APP="gq_advanced_v3";
const money=n=>`Rs. ${Math.round(Number(n)||0).toLocaleString("en-PK")}`;
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const defaultRates={glass12:900,glass10:750,glass8:600,glass6:480,tempering:180,design:120,labour:150,d48a:250,d48b:250,d48:220,ugola:180,machine:500,lpatch:700,handle:1200,lock:900,gg:250,wg:250,silicone:650,delivery:0,measurement:0};
const defaultCompany={name:"Glass & Aluminium Works",phone:"",whatsapp:"",address:"",email:"",logo:"",terms:"Prices are subject to final site measurement. Glass thickness, colour and hardware will be confirmed before production. Advance payment is required as agreed.",currency:"Rs."};
const blankCustomer={name:"",phone:"",address:"",date:today(),validity:7,notes:""};
const blankForm={type:"Single Door",thickness:"12mm",glassType:"Clear",wastage:5,width:"",height:"",qty:1,tempered:true,designed:false,labour:true,top:"d48a",bottom:"d48b",side:"d48",machine:0,lpatch:0,handle:1,lock:1,gg:0,wg:0,silicone:0,description:""};
const safe=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x??d}catch{return d}};

function calcItem(f,r){
 const w=+f.width||0,h=+f.height||0,q=Math.max(1,+f.qty||1),base=(w*h/144)*q,area=base*(1+(+f.wastage||0)/100);
 const glassRate=r[{"12mm":"glass12","10mm":"glass10","8mm":"glass8","6mm":"glass6"}[f.thickness]]||0;
 const glass=area*glassRate, temper=f.tempered?area*r.tempering:0, design=f.designed?area*r.design:0, labour=f.labour?area*r.labour:0;
 const top=(w/12)*q*(r[f.top]||0),bottom=(w/12)*q*(r[f.bottom]||0),side=(2*h/12)*q*(r[f.side]||0);
 const machine=(+f.machine||0)*(r.machine||0),lpatch=(+f.lpatch||0)*(r.lpatch||0),handle=(+f.handle||0)*(r.handle||0),lock=(+f.lock||0)*(r.lock||0),gg=(+f.gg||0)*(r.gg||0),wg=(+f.wg||0)*(r.wg||0),silicone=(+f.silicone||0)*(r.silicone||0);
 const total=glass+temper+design+labour+top+bottom+side+machine+lpatch+handle+lock+gg+wg+silicone;
 return {...f,area,glass,temper,design,labour,top,bottom,side,machine,lpatch,handle,lock,gg,wg,silicone,total};
}

function App(){
 const saved0=safe(APP+"_saved",[]), draft=safe(APP+"_draft",null), settings=safe(APP+"_settings",null);
 const [tab,setTab]=useState("quote"); const [rates,setRates]=useState(settings?.rates||defaultRates); const [company,setCompany]=useState(settings?.company||defaultCompany);
 const [customer,setCustomer]=useState(draft?.customer||blankCustomer); const [items,setItems]=useState(draft?.items||[]); const [discount,setDiscount]=useState(draft?.discount||0); const [tax,setTax]=useState(draft?.tax||0); const [delivery,setDelivery]=useState(draft?.delivery||0); const [advance,setAdvance]=useState(draft?.advance||0); const [status,setStatus]=useState(draft?.status||"Draft"); const [payment,setPayment]=useState(draft?.payment||"Cash"); const [qno,setQno]=useState(draft?.qno||`GQ-${String((saved0.length||0)+1).padStart(4,"0")}`); const [saved,setSaved]=useState(saved0); const [draftSaved,setDraftSaved]=useState(true);
 useEffect(()=>{localStorage.setItem(APP+"_saved",JSON.stringify(saved));},[saved]);
 useEffect(()=>{localStorage.setItem(APP+"_settings",JSON.stringify({rates,company}));},[rates,company]);
 useEffect(()=>{const d={customer,items,discount,tax,delivery,advance,status,payment,qno};localStorage.setItem(APP+"_draft",JSON.stringify(d));setDraftSaved(true)},[customer,items,discount,tax,delivery,advance,status,payment,qno]);
 useEffect(()=>{const stop=e=>{if(e.key==="Enter"&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))e.preventDefault()};document.addEventListener("keydown",stop);return()=>document.removeEventListener("keydown",stop)},[]);
 const subtotal=useMemo(()=>items.reduce((s,x)=>s+x.total,0),[items]); const disc=subtotal*(+discount||0)/100; const taxAmt=(subtotal-disc)*(+tax||0)/100; const grand=Math.max(0,subtotal-disc+taxAmt+(+delivery||0)); const balance=Math.max(0,grand-(+advance||0));
 function newQuote(){if((items.length||customer.name)&&!confirm("Start a new quotation? Current draft will be cleared."))return; const n=saved.length+1;setQno(`GQ-${String(n).padStart(4,"0")}`);setCustomer({...blankCustomer,date:today()});setItems([]);setDiscount(0);setTax(0);setDelivery(0);setAdvance(0);setStatus("Draft");setPayment("Cash");window.scrollTo({top:0,behavior:"auto"});}
 function saveQuote(){const record={id:uid(),qno,customer,items,discount,tax,delivery,advance,status,payment,subtotal,disc,taxAmt,grand,balance,date:customer.date};setSaved(a=>[record,...a.filter(x=>x.qno!==qno)]);setStatus("Saved");alert("Quotation saved successfully.");}
 function loadQuote(x){setQno(x.qno);setCustomer(x.customer);setItems(x.items);setDiscount(x.discount);setTax(x.tax);setDelivery(x.delivery||0);setAdvance(x.advance);setStatus(x.status||"Saved");setPayment(x.payment||"Cash");setTab("quote");setTimeout(()=>window.scrollTo({top:0,behavior:"auto"}),50)}
 async function downloadPDF(){
  const el=document.getElementById("print-area");
  if(!el){return alert("Quotation area not found");}
  const old=el.style.width;
  try{
    el.style.width="794px";
    const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:794});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF("p","mm","a4");
    const pageW=210,pageH=297,margin=8;
    const imgW=pageW-margin*2;
    const imgH=canvas.height*imgW/canvas.width;
    let y=margin, remaining=imgH, srcY=0;
    const pagePxH=Math.floor(canvas.width*(pageH-margin*2)/imgW);
    while(srcY<canvas.height){
      const slice=document.createElement("canvas"); slice.width=canvas.width; slice.height=Math.min(pagePxH,canvas.height-srcY);
      slice.getContext("2d").drawImage(canvas,0,srcY,canvas.width,slice.height,0,0,canvas.width,slice.height);
      const data=slice.toDataURL("image/jpeg",0.95);
      const sliceH=slice.height*imgW/canvas.width;
      if(srcY>0) pdf.addPage();
      pdf.addImage(data,"JPEG",margin,margin,imgW,sliceH,"","FAST");
      srcY+=slice.height;
    }
    pdf.save((p.qno||"Quotation")+".pdf");
  }catch(e){console.error(e);alert("PDF download failed. Please try again.");}
  finally{el.style.width=old;}
}
function print(){window.print()}
 function whatsapp(){const text=`*${company.name}*\nQuotation: ${qno}\nCustomer: ${customer.name||"Walk-in Customer"}\nGrand Total: ${money(grand)}\nAdvance: ${money(advance)}\nBalance: ${money(balance)}\n\nThank you.`;window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
 function backup(){const blob=new Blob([JSON.stringify({saved,rates,company},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Glass_Aluminium_Backup.json";a.click()}
 return <div className="app-shell min-h-screen"><header className="bg-gradient-to-r from-blue-950 to-blue-700 text-white px-4 py-4"><div className="max-w-7xl mx-auto flex flex-wrap justify-between gap-3 items-center"><div><div className="text-xs tracking-[.25em] opacity-80">PROFESSIONAL EDITION</div><h1 className="text-2xl md:text-3xl font-black">Glass & Aluminium Quotation Pro</h1><p className="text-blue-100 text-sm">Quotation • Costing • Billing • Customer Management</p></div><div className="text-right text-sm"><b>{qno}</b><div className="opacity-80">{status} • Auto-save {draftSaved?"✓":"…"}</div></div></div></header>
 <nav className="appnav bg-white border-b sticky top-0 z-40"><div className="max-w-7xl mx-auto flex overflow-x-auto">{[["quote","🧾 Quotation"],["saved","📁 Saved Bills"],["dashboard","📊 Dashboard"],["settings","⚙ Settings"]].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={`px-5 py-4 font-bold whitespace-nowrap ${tab===k?"text-blue-700 border-b-4 border-blue-700":"text-gray-500"}`}>{l}</button>)}</div></nav>
 {tab==="quote"&&<Builder company={company} customer={customer} setCustomer={setCustomer} items={items} setItems={setItems} rates={rates} qno={qno} discount={discount} setDiscount={setDiscount} tax={tax} setTax={setTax} delivery={delivery} setDelivery={setDelivery} advance={advance} setAdvance={setAdvance} status={status} setStatus={setStatus} payment={payment} setPayment={setPayment} subtotal={subtotal} disc={disc} taxAmt={taxAmt} grand={grand} balance={balance} newQuote={newQuote} saveQuote={saveQuote} print={print} downloadPDF={downloadPDF} whatsapp={whatsapp}/>} 
 {tab==="saved"&&<Saved saved={saved} setSaved={setSaved} loadQuotation={loadQuote}/>} {tab==="dashboard"&&<Dashboard saved={saved}/>} {tab==="settings"&&<Settings rates={rates} setRates={setRates} company={company} setCompany={setCompany} backup={backup}/>}</div>}

function Builder(p){const [f,setF]=useState(safe(APP+"_itemdraft",blankForm));const [editIndex,setEditIndex]=useState(null);const set=k=>e=>setF(v=>({...v,[k]:e.target.type==="checkbox"?e.target.checked:e.target.type==="number"?e.target.value:e.target.value}));useEffect(()=>localStorage.setItem(APP+"_itemdraft",JSON.stringify(f)),[f]);
 function add(){if(!f.width||!f.height){alert("Width aur Height enter karein.");return}const x=calcItem(f,p.rates);p.setItems(a=>editIndex===null?[...a,x]:a.map((z,i)=>i===editIndex?x:z));setEditIndex(null);setF({...blankForm,thickness:f.thickness,glassType:f.glassType});}
 function edit(i){setF({...p.items[i]});setEditIndex(i);window.scrollTo({top:120,behavior:"smooth"})}function remove(i){if(confirm("Remove this item?"))p.setItems(a=>a.filter((_,j)=>j!==i))}function duplicate(i){p.setItems(a=>[...a.slice(0,i+1),{...a[i]},...a.slice(i+1)])}
 return <main className="max-w-7xl mx-auto p-3 md:p-5 grid xl:grid-cols-12 gap-5"><section className="xl:col-span-5"><div className="card p-4 md:p-5"><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-black">{editIndex===null?"Add New Item":"Edit Item"}</h2><span className="text-xs bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-bold">Live Costing</span></div><div className="grid grid-cols-2 gap-3"><Field label="Work Type"><select value={f.type} onChange={set("type")}><option>Single Door</option><option>Double Door</option><option>Fix</option><option>Sliding Door</option><option>Sliding Window</option><option>Glass Partition</option><option>Shower Enclosure</option><option>Table Top</option><option>Custom</option></select></Field><Field label="Thickness"><select value={f.thickness} onChange={set("thickness")}><option>12mm</option><option>10mm</option><option>8mm</option><option>6mm</option></select></Field><Field label="Glass Type"><select value={f.glassType} onChange={set("glassType")}><option>Clear</option><option>Blue</option><option>Green</option><option>Brown</option><option>Grey</option><option>Mercury</option><option>Frosted</option><option>Design</option><option>Reflective</option></select></Field><Field label="Quantity"><input type="number" min="1" value={f.qty} onChange={set("qty")}/></Field><Field label="Width (inch)"><input inputMode="decimal" type="number" value={f.width} onChange={set("width")} placeholder="e.g. 48"/></Field><Field label="Height (inch)"><input inputMode="decimal" type="number" value={f.height} onChange={set("height")} placeholder="e.g. 84"/></Field><Field label="Wastage %"><input type="number" value={f.wastage} onChange={set("wastage")}/></Field><Field label="Description"><input value={f.description} onChange={set("description")} placeholder="Bedroom / Front / Office"/></Field></div>
 <div className="grid grid-cols-2 gap-2 mt-4">{[["tempered","Tempered Glass"],["designed","Design / Frost"],["labour","Labour" ]].map(([k,l])=><label key={k} className="border rounded-xl p-3 flex gap-2 items-center font-bold text-sm"><input type="checkbox" checked={!!f[k]} onChange={set(k)}/>{l}</label>)}</div>
 <h3 className="font-black mt-5 mb-2">Profiles</h3><div className="grid grid-cols-3 gap-2"><Field label="Top"><select value={f.top} onChange={set("top")}><option value="d48a">D48A</option><option value="d48b">D48B</option><option value="d48">D48</option><option value="ugola">U Gola</option></select></Field><Field label="Bottom"><select value={f.bottom} onChange={set("bottom")}><option value="d48a">D48A</option><option value="d48b">D48B</option><option value="d48">D48</option><option value="ugola">U Gola</option></select></Field><Field label="Side"><select value={f.side} onChange={set("side")}><option value="d48">D48</option><option value="d48a">D48A</option><option value="d48b">D48B</option><option value="ugola">U Gola</option></select></Field></div>
 <h3 className="font-black mt-5 mb-2">Hardware Qty</h3><div className="grid grid-cols-4 gap-2">{[["machine","Machine"],["lpatch","L-Patch"],["handle","Handle"],["lock","Lock"],["gg","G-G"],["wg","W-G"],["silicone","Silicone"]].map(([k,l])=><Field key={k} label={l}><input type="number" min="0" value={f[k]} onChange={set(k)}/></Field>)}</div>
 {f.width&&f.height&&<div className="mt-5 p-4 rounded-xl bg-blue-50 border border-blue-100"><div className="text-xs font-bold text-blue-700">ESTIMATED ITEM</div><div className="text-2xl font-black text-blue-900">{money(calcItem(f,p.rates).total)}</div><div className="text-sm text-gray-600">Area: {calcItem(f,p.rates).area.toFixed(2)} sq.ft</div></div>}
 <button onClick={add} className="w-full mt-5 p-4 rounded-xl bg-blue-700 text-white font-black text-lg">{editIndex===null?"＋ Add Item":"✓ Update Item"}</button>{editIndex!==null&&<button onClick={()=>{setEditIndex(null);setF(blankForm)}} className="w-full mt-2 p-3 rounded-xl bg-gray-100 font-bold">Cancel Edit</button>}</div>
 <div className="card p-4 mt-4"><h3 className="font-black mb-3">Quotation Details</h3><div className="grid grid-cols-2 gap-3"><Field label="Customer Name"><input value={p.customer.name} onChange={e=>p.setCustomer({...p.customer,name:e.target.value})}/></Field><Field label="Phone"><input inputMode="tel" value={p.customer.phone} onChange={e=>p.setCustomer({...p.customer,phone:e.target.value})}/></Field><Field label="Date"><input type="date" value={p.customer.date} onChange={e=>p.setCustomer({...p.customer,date:e.target.value})}/></Field><Field label="Valid For (days)"><input type="number" value={p.customer.validity} onChange={e=>p.setCustomer({...p.customer,validity:+e.target.value||0})}/></Field></div><Field label="Address"><textarea rows="2" value={p.customer.address} onChange={e=>p.setCustomer({...p.customer,address:e.target.value})}/></Field><Field label="Customer Notes"><textarea rows="2" value={p.customer.notes} onChange={e=>p.setCustomer({...p.customer,notes:e.target.value})}/></Field></div>
 </section><section className="xl:col-span-7"><div className="stickybar p-2 mb-3 rounded-xl no-print"><div className="flex flex-wrap gap-2"><button onClick={p.newQuote} className="px-4 py-2 bg-gray-200 rounded-lg font-bold">New</button><button onClick={p.saveQuote} className="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold">Save</button><button onClick={p.downloadPDF} className="px-4 py-2 bg-blue-700 text-white rounded-lg font-bold">⬇ PDF</button><button onClick={p.print} className="px-4 py-2 bg-indigo-700 text-white rounded-lg font-bold">🖨 Print</button><button onClick={p.whatsapp} className="px-4 py-2 bg-green-600 text-white rounded-lg font-bold">WhatsApp</button></div></div>
 <div id="print-area" className="card p-5 md:p-8 bg-white"><div className="flex justify-between gap-4 border-b-2 border-blue-800 pb-5"><div className="flex gap-3 items-center">{p.company.logo&&<img src={p.company.logo} className="w-16 h-16 object-contain"/>}<div><h1 className="text-2xl font-black text-blue-950">{p.company.name}</h1><div className="text-xs text-gray-500">{p.company.address}</div><div className="text-xs text-gray-500">{p.company.phone}{p.company.whatsapp&&` • WhatsApp: ${p.company.whatsapp}`}</div></div></div><div className="text-right"><div className="text-2xl font-black">QUOTATION</div><b className="text-blue-700">{p.qno}</b><div className="text-xs">{p.customer.date}</div><div className="text-xs font-bold">Valid {p.customer.validity} days</div></div></div>
 <div className="grid md:grid-cols-3 gap-3 bg-gray-50 p-4 rounded-xl my-5"><div><small>Bill To</small><div className="font-bold">{p.customer.name||"Walk-in Customer"}</div></div><div><small>Phone</small><div>{p.customer.phone||"N/A"}</div></div><div><small>Address</small><div>{p.customer.address||"N/A"}</div></div></div>
 {p.items.length?<div className="table-wrap"><table className="w-full text-xs md:text-sm print-table"><thead><tr className="bg-blue-900 text-white"><th className="p-2">#</th><th className="p-2 text-left">Description</th><th className="p-2">Area</th><th className="p-2 text-right">Amount</th><th className="p-2 no-print">Action</th></tr></thead><tbody>{p.items.map((x,i)=><tr key={i} className="border-b align-top"><td className="p-2 text-center">{i+1}</td><td className="p-2"><b>{x.type} — {x.thickness} {x.glassType}</b><div className="text-gray-500">{x.width}" × {x.height}" × Qty {x.qty} {x.description&&` • ${x.description}`}</div><div className="text-[10px] text-gray-500">Profiles: {x.top}/{x.bottom}/{x.side} • {x.tempered?"Tempered • ":""}{x.designed?"Design/Frost • ":""}{x.labour?"Labour":""}</div></td><td className="p-2 text-center">{x.area.toFixed(2)}</td><td className="p-2 text-right font-bold">{money(x.total)}</td><td className="p-2 no-print"><div className="flex gap-1"><button onClick={()=>edit(i)} className="text-blue-700 font-bold">Edit</button><button onClick={()=>duplicate(i)} className="text-purple-700 font-bold">Copy</button><button onClick={()=>remove(i)} className="text-red-600 font-bold">×</button></div></td></tr>)}</tbody></table></div>:<div className="py-16 text-center text-gray-400 no-print">Add items from the left panel.</div>}
 {p.items.length>0&&<div className="mt-7 grid md:grid-cols-2 gap-6"><div><h3 className="font-black text-blue-900 border-b pb-2">Detailed Cost Summary</h3>{[["Glass",p.items.reduce((s,x)=>s+x.glass,0)],["Tempering",p.items.reduce((s,x)=>s+x.temper,0)],["Design / Frost",p.items.reduce((s,x)=>s+x.design,0)],["Labour",p.items.reduce((s,x)=>s+x.labour,0)],["Top Profiles",p.items.reduce((s,x)=>s+x.top,0)],["Bottom Profiles",p.items.reduce((s,x)=>s+x.bottom,0)],["Side Profiles",p.items.reduce((s,x)=>s+x.side,0)],["Machine",p.items.reduce((s,x)=>s+x.machine,0)],["L-Patch",p.items.reduce((s,x)=>s+x.lpatch,0)],["Handle",p.items.reduce((s,x)=>s+x.handle,0)],["Lock",p.items.reduce((s,x)=>s+x.lock,0)],["G-G Joint",p.items.reduce((s,x)=>s+x.gg,0)],["W-G Joint",p.items.reduce((s,x)=>s+x.wg,0)],["Silicone",p.items.reduce((s,x)=>s+x.silicone,0)]].filter(a=>a[1]>0).map(a=><div className="summary-row" key={a[0]}><span>{a[0]}</span><b>{money(a[1])}</b></div>)}</div><div className="bg-gray-50 rounded-xl p-5"><div className="summary-row"><span>Subtotal</span><b>{money(p.subtotal)}</b></div><div className="flex justify-between gap-2 py-2 items-center"><span>Discount %</span><input className="w-24 p-2 border rounded text-right no-print" type="number" value={p.discount} onChange={e=>p.setDiscount(+e.target.value||0)}/><b className="print-only">{p.discount}%</b><span className="no-print">{money(p.disc)}</span></div><div className="flex justify-between gap-2 py-2 items-center"><span>Tax %</span><input className="w-24 p-2 border rounded text-right no-print" type="number" value={p.tax} onChange={e=>p.setTax(+e.target.value||0)}/><b className="print-only">{p.tax}%</b><span className="no-print">{money(p.taxAmt)}</span></div><div className="flex justify-between py-2"><span>Delivery / Other</span><input className="w-28 p-2 border rounded text-right no-print" type="number" value={p.delivery} onChange={e=>p.setDelivery(+e.target.value||0)}/><b className="print-only">{money(p.delivery)}</b></div><div className="summary-row text-xl border-t-2"><b>Grand Total</b><b>{money(p.grand)}</b></div><div className="flex justify-between py-2"><span>Advance</span><input className="w-28 p-2 border rounded text-right no-print" type="number" value={p.advance} onChange={e=>p.setAdvance(+e.target.value||0)}/><b className="print-only">{money(p.advance)}</b></div><div className="summary-row text-xl text-red-700"><b>Balance Due</b><b>{money(p.balance)}</b></div><div className="mt-3 text-xs"><b>Payment:</b> {p.payment} &nbsp; <b>Status:</b> {p.status}</div></div></div>}
 <div className="mt-7 border-t pt-5 text-xs text-gray-500"><b>Notes:</b> {p.customer.notes||"—"}<div className="mt-3"><b>Terms & Conditions</b><p className="whitespace-pre-line">{p.company.terms}</p></div><div className="flex justify-between mt-12"><span className="border-t w-40 text-center pt-2">Customer Signature</span><span className="border-t w-40 text-center pt-2">Authorized Signature</span></div></div></div>
 <div className="card p-4 mt-4 no-print"><div className="grid grid-cols-2 gap-3"><Field label="Payment Status"><select value={p.status} onChange={e=>p.setStatus(e.target.value)}><option>Draft</option><option>Sent</option><option>Approved</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></Field><Field label="Payment Method"><select value={p.payment} onChange={e=>p.setPayment(e.target.value)}><option>Cash</option><option>Bank Transfer</option><option>JazzCash</option><option>EasyPaisa</option><option>Cheque</option><option>Credit</option></select></Field></div></div>
 </section></main>}
function Field({label,children}){return <label className="block"><span className="text-xs font-bold text-gray-600 block mb-1">{label}</span>{React.cloneElement(children,{className:(children.props.className||"")+" w-full p-2.5 border rounded-lg bg-white"})}</label>}
function Saved({saved,setSaved,loadQuotation}){const [q,setQ]=useState("");const list=saved.filter(x=>(x.qno+" "+(x.customer.name||"")+" "+(x.customer.phone||"")).toLowerCase().includes(q.toLowerCase()));return <main className="max-w-6xl mx-auto p-4 md:p-5"><div className="card p-5"><div className="flex flex-wrap justify-between gap-3 items-center mb-5"><h2 className="text-2xl font-black">Saved Quotations</h2><input className="border rounded-lg p-2" placeholder="Search quotation/customer" value={q} onChange={e=>setQ(e.target.value)}/></div>{!list.length?<p className="text-gray-500">No quotations found.</p>:<div className="space-y-3">{list.map(x=><div key={x.id} className="border rounded-xl p-4 flex flex-wrap justify-between gap-3"><div><b className="text-blue-700">{x.qno}</b><div className="font-bold">{x.customer.name||"Walk-in Customer"}</div><small>{x.date} • {money(x.grand)} • Balance {money(x.balance)} • {x.status}</small></div><div className="flex gap-2"><button onClick={()=>loadQuotation(x)} className="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg font-bold">Open</button><button onClick={()=>{if(confirm("Delete quotation?"))setSaved(a=>a.filter(y=>y.id!==x.id))}} className="px-4 py-2 bg-red-100 text-red-700 rounded-lg font-bold">Delete</button></div></div>)}</div>}</div></main>}
function Dashboard({saved}){const total=saved.reduce((s,x)=>s+x.grand,0),due=saved.reduce((s,x)=>s+x.balance,0),approved=saved.filter(x=>x.status==="Approved").length;return <main className="max-w-6xl mx-auto p-4 md:p-5"><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">{[["Total Quotations",saved.length],["Quotation Value",money(total)],["Balance Due",money(due)],["Approved",approved]].map(a=><div className="card p-5" key={a[0]}><div className="text-gray-500 text-sm">{a[0]}</div><div className="text-2xl font-black mt-2">{a[1]}</div></div>)}</div><div className="card p-5 mt-5"><h2 className="text-xl font-black mb-3">Recent Quotations</h2>{saved.slice(0,8).map(x=><div className="summary-row" key={x.id}><span><b>{x.qno}</b> — {x.customer.name||"Walk-in"}</span><b>{money(x.grand)}</b></div>)}</div></main>}
function Settings({rates,setRates,company,setCompany,backup}){const Rate=({k,label,unit})=><div className="flex justify-between items-center gap-3 p-3 border rounded-lg"><div><b>{label}</b><div className="text-xs text-gray-500">{unit}</div></div><input type="number" value={rates[k]??0} onChange={e=>setRates({...rates,[k]:+e.target.value||0})} className="w-28 p-2 border rounded text-right"/></div>;return <main className="max-w-6xl mx-auto p-4 md:p-5 grid lg:grid-cols-2 gap-5"><div className="card p-5"><h2 className="text-2xl font-black mb-4">Rate Manager</h2><div className="grid gap-3">{[["glass12","12mm Glass","sq.ft"],["glass10","10mm Glass","sq.ft"],["glass8","8mm Glass","sq.ft"],["glass6","6mm Glass","sq.ft"],["tempering","Tempering","sq.ft"],["design","Design/Frost","sq.ft"],["labour","Labour","sq.ft"],["d48a","D48A","running ft"],["d48b","D48B","running ft"],["d48","D48","running ft"],["ugola","U Gola","running ft"],["machine","Machine","piece"],["lpatch","L-Patch","piece"],["handle","Handle","piece"],["lock","Lock","piece"],["gg","G-G Joint","piece"],["wg","W-G Joint","piece"],["silicone","Silicone","tube"]].map(a=><Rate key={a[0]} k={a[0]} label={a[1]} unit={a[2]}/>)}</div></div><div className="card p-5"><h2 className="text-2xl font-black mb-4">Company Profile</h2><div className="space-y-3">{[["name","Company Name"],["phone","Phone"],["whatsapp","WhatsApp"],["address","Address"],["email","Email"]].map(([k,l])=><label key={k} className="block"><span className="text-xs font-bold">{l}</span><input value={company[k]||""} onChange={e=>setCompany({...company,[k]:e.target.value})} className="w-full p-2.5 border rounded-lg"/></label>)}<label className="block"><span className="text-xs font-bold">Terms</span><textarea rows="6" value={company.terms} onChange={e=>setCompany({...company,terms:e.target.value})} className="w-full p-2.5 border rounded-lg"/></label><label className="block"><span className="text-xs font-bold">Logo</span><input type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>setCompany({...company,logo:r.result});r.readAsDataURL(f)}} className="w-full p-2 border rounded-lg"/></label><div className="grid grid-cols-2 gap-2"><button onClick={backup} className="p-3 bg-gray-900 text-white rounded-xl font-black">⬇ Export Backup</button><label className="p-3 bg-blue-700 text-white rounded-xl font-black text-center cursor-pointer">⬆ Restore<input type="file" accept="application/json" className="hidden" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const rr=new FileReader();rr.onload=()=>{try{const d=JSON.parse(rr.result);if(d.rates)setRates(d.rates);if(d.company)setCompany(d.company);if(d.saved)localStorage.setItem(APP+"_saved",JSON.stringify(d.saved));alert("Backup restored. Reloading…");location.reload()}catch{alert("Invalid backup file")}};rr.readAsText(f)}}/></label></div><p className="text-xs text-gray-500">Rates, company profile, quotations and draft are stored locally on this device/browser.</p></div></div></main>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
